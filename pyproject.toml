[project]
name = "heatwave-chap"
version = "0.1.0"
description = "Ward-level heatwave detection pipeline producing a weekly covariate table for CHAP"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["heatwave*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "frozen: needs the real covariates-v1.0 data under <local_data_dir>/frozen (skipped automatically when absent)",
    "slow: subprocess-heavy or heavy-import tests; run by default (CI uses plain pytest), excluded from the quick loop with -m \"not slow\"",
]
