# Forecast settings (v2.0). Parsed with yaml.safe_load and validated by heatwave/forecast/config.py.

# Frozen covariate table: version tag, subfolder under local_data_dir, and pinned parquet sha256 anchor.
data:
  version: covariates-v1.0
  frozen_subdir: frozen
  expected_parquet_sha256: 82583fbf5deedce2ee1a3cee2ad2b12e36c9c2c83ef14e9f6b102a1eb4a7f137

# Chronological splits. Cutoffs are exclusive Monday week_start bounds (week_start < cutoff):
# train < train_end <= validate < validate_end <= test. 2020-W53 (2020-12-28..2021-01-03) falls in validate.
splits:
  train_years: [1991, 2014]
  validate_years: [2015, 2020]
  test_years: [2021, 2026]
  train_end: 2014-12-29
  validate_end: 2021-01-04
  embargo_weeks: 6

# Forecast leads in weeks ahead.
leads: [1, 2, 3, 4, 5, 6]

# Forecast framing (user decision 2026-10-06): the last complete observed week is treated as "now".
# A forecast is issued at the end of that week with no data-delay offset, so lead k = k weeks after
# the last observed week (lead 1 starts the next day). The real-world ERA5-Land delay (about 9 days,
# measured 2026-10-06) is documented in the data report as an operational note only.
latency_days: 0

# Baselines the models must beat (Phase 10).
baselines:
  names: [climatology, recent_climatology, persistence, damped_persistence, trend_season]
  recent_climatology_years: 10

# Success gate: BSS > threshold vs the best baseline on primary leads, with the CI excluding the threshold.
gate:
  primary_leads: [1, 2]
  metric: brier_skill_score
  reference: best_baseline
  threshold: 0.0
  ci_level: 0.95
  ci_must_exclude_threshold: true

# Retrain policy: refit on 1991-2020 with frozen hyperparameters before the single test;
# the operational model is refit on all years and labelled as not independently tested.
retrain_policy:
  pre_test_refit_years: [1991, 2020]
  freeze_hyperparameters: true
  operational_refit: all_years
  operational_label: "not independently tested"

# Model hyperparameters: initial values, tuned in Phase 12.
models:
  logistic_regression:
    C: 1.0
    penalty: l2
    max_iter: 2000
  lightgbm:
    num_leaves: 15
    learning_rate: 0.05
    n_estimators: 500
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    deterministic: true
    force_row_wise: true

# Global random seed.
seed: 20261002
